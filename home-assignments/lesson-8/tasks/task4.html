        <h1 class="task__title">Задача 4.</h1>
        <p>
          Дано послідовність платіжок протягом року. Знайти сумарну кількість
          грошей за:
          <br />
          за весь рік;
          <br />
          у першій половині року;
          <br />
          у другій половині року;
          <br />
          за літо;
          <br />
          за ІІ квартал;
          <br />
          за парні місяці (з парними номерами);
          <br />
          за місяці, які є початковими у сезоні (весна, літо, осінь, зима).
        </p>
