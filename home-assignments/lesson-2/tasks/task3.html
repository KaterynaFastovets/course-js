<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <title>Task</title>
  </head>
  <body  style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 25px 15px;
      box-sizing: border-box;
      gap: 15px;
    ">
    <div class="task">
      <div class="task__container">
        <a class="task__button button" href="../index.html">Tasks</a>
        <h1 class="task__title">Задача 3.</h1>
        <p>
           Дано вартість одиниці товару і кількість. Знайти загальну вартість та ПДВ
      (5% від загальної вартості).
        </p>
      </div>
    </div>
    <script>
      // Вводимо необхідні дані
      const price = parseFloat(prompt("Введіть вартість товару", "20.5"));
      const pcs = parseInt(prompt("Введіть кількість товару", "5"));
      let VAT = 0.05;
      // Заходимо результат
      const generalCost = price * pcs;
      const amountVat = generalCost * VAT;
      // Виводимо результат
      document.write(`
      <p>Загальна вартість товару - ${generalCost} грн. </p>
      <p>ПДВ (5% від загальної вартості) - ${amountVat} грн. </p>
      `);
    </script>
  </body>
</html>
