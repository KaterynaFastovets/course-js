<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <title>Task</title>
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 25px 15px;
      box-sizing: border-box;
      gap: 15px;
    "
  >
      <div class="task">
      <div class="task__container">
        <a class="task__button button" href="../index.html">Tasks</a>
        <h1 class="task__title">Задача 7.</h1>
        <p>
           Знайти суму випадкового номера місяця (від 1 до 12) та випадкового номера
      дня (від 0 до 6).
        </p>
      </div>
    </div>
    <script>
      // Вводимо необхідні дані
      const minMonth = 1;
      const maxMonth = 12;
      const minDay = 0;
      const maxDay = 6;

      // Заходимо результат
      const randomMount = Math.floor(
        Math.random() * (maxMonth - minMonth) + minMonth,
      );
      //  min + Math.floor(Math.random() *(max - min + 1);
      const randomDay = Math.floor(Math.random() * (maxDay - minDay) + minDay);
      const sum = randomMount + randomDay;

      // Виводимо результат
      document.write(`
      <p>Випадковий номер місяця - ${randomMount}</p>
       <p>Випадковий номер дня  - ${randomDay}</p>
        <p>Сума цих чисел - ${sum}</p>
      `);
    </script>
  </body>
</html>
