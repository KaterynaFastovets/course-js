<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />

    <title>Task</title>

  <body>
    <h1>Задача 5.</h1>
    <p>
      Дано кількість секунд, що пройшла від початку доби. Визначити скільки це
      годин і хвилин.
    </p>

    <script>
        // Вводимо необхідні дані
     const seconds = parseInt(prompt("Введіть кількість секунд, що пройшла від початку доби", "3006"));
  

      // Заходимо результат
       const minutes =Math.floor(seconds / 60) ;
      const horus = Math.floor(minutes/ 60) ;
     
      // Виводимо результат
      document.write(`
      <p> ${seconds} секунд - це ${horus} годин і ${minutes} хвилин</p>
      `);
    </script>
  </body>
  
</html>
