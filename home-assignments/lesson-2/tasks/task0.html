<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <title>Task</title>
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 25px 15px;
      box-sizing: border-box;
      gap: 15px;
    "
  >
    <div class="task">
      <div class="task__container">
        <a class="task__button button" href="../index.html">Tasks</a>
        <h1 class="task__title">Задача 0.</h1>
        <p>Обчислити значення виразів</p>
      </div>
    </div>
    <script>
      // Вводимо необхідні дані
      let a = parseInt(prompt("Введіть значення а", "1"));
      let b = parseInt(prompt("Введіть значення b", "1"));
      let c = parseInt(prompt("Введіть значення c", "1"));

      // Заходимо результат
      //  1)
      const s1 = a + 12 + b;
      //  2)
      const s2 = Math.sqrt(((a + b) / 2) * a);
      //  3)
      const s3 = Math.sin(a / -b);
      // Виводимо результат
      document.write(`
      <p>Результат виразу 1: ${s1} </p>
      <p>Результат виразу 2: ${s2} </p>
      <p>Результат виразу 3: ${s3} </p>
      `);
    </script>
  </body>
</html>
