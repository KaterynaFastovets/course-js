<!doctype html>
<html lang="zxx">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <title>Task</title>
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 25px 15px;
      box-sizing: border-box;
      gap: 15px;
    "
  >
    <div class="task">
      <div class="task__container">
        <a class="task__button button" href="../index.html">Tasks</a>
        <h1 class="task__title">Задача 2.</h1>
        <p>
          Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість
          років.
        </p>
      </div>
    </div>
    <script>
      // Вводимо необхідні дані
      const birthYear = parseInt(prompt("Введіть Ваш рік народження", "1989"));
      let currentYear = 2026;
      // Заходимо результат
      const userAge = 2026 - birthYear;
      // Виводимо результат
      document.write(`
      <p>Вам ${userAge} років. </p>
      `);
    </script>
  </body>
</html>
